<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Minus S1 ridge render</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #9aa3b2; font: 12px Menlo, monospace; }
      #stage { position: fixed; inset: 0 0 28px 0; display: flex; align-items: center; justify-content: center; }
      #out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; display: flex; gap: 12px; align-items: center; padding: 0 10px; }
      #bar input[type=range] { flex: 1; }
      body.render #bar input, body.live #bar input { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
    <div id="bar"><span id="status">loading…</span><input id="scrub" type="range" min="0" max="1000" value="0" /><span>space = play/pause</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
