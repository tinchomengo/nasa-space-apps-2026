<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Minus HUD</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #555; font: 12px Menlo, monospace; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
      #status { position: fixed; left: 8px; bottom: 6px; opacity: 0.6; }
      body.live #status { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
    <span id="status"></span>
    <script type="module" src="/src/hud.js"></script>
  </body>
</html>
